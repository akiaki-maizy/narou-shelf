<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>なろう本棚</title>
<style>
:root{
  --bg:#111418;--panel:#1a1f25;--line:#2b333d;--text:#eef2f6;--muted:#9aa6b2;
  --accent:#5aa9ff;--danger:#ff6b6b;--warn:#ffcc66;--ok:#5fd18b;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP","Yu Gothic UI",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;padding:14px 16px;background:rgba(17,20,24,.96);border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 10px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer;text-align:left;color:var(--text)} .chip.active{outline:2px solid var(--accent);border-color:var(--accent)}
.toolbar{display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap}
button,.btn{appearance:none;border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--panel);color:var(--text);font-size:15px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.primary,.btn.primary{background:var(--accent);color:#06131f;border-color:transparent;font-weight:700}
button.danger{color:#ffd8d8;border-color:#6b3333}
.more-menu{position:relative}
.more-menu>summary{list-style:none;cursor:pointer}
.more-menu>summary::-webkit-details-marker{display:none}
.menu-panel{position:absolute;z-index:10;top:calc(100% + 6px);right:0;min-width:190px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.menu-panel button,.menu-panel .btn{display:flex;width:100%;justify-content:flex-start;margin:4px 0;white-space:nowrap}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0f1317;color:var(--text);font-size:16px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
main{padding:0 16px 90px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;margin:10px 0}
.title{font-size:17px;font-weight:700;margin-bottom:6px;line-height:1.45}
.meta{font-size:13px;color:var(--muted);line-height:1.6}
.unread{color:var(--warn);font-weight:700}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.actions .wide{grid-column:1/-1}
.card-actions{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) auto;gap:8px;margin-top:12px}
.card-actions .btn,.card-actions button{min-width:0;padding-left:9px;padding-right:9px}
.card-more .menu-panel{min-width:180px}
dialog{width:min(92vw,560px);border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.65)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.filters{padding:0 16px 8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:12px;color:var(--muted)}
.fetchbox{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.statusmsg{margin-top:8px;font-size:13px;min-height:1.4em}
.statusmsg.ok{color:var(--ok)}
.statusmsg.err{color:#ff9f9f}
.readonly{background:#151a20}
</style>

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

</head>
<body>
<header>
  <h1>📚 なろう本棚 <span style="font-size:12px;color:#9aa6b2">v7.1</span></h1>
  <div class="summary" id="summary"></div>
</header>

<div class="toolbar">
  <button class="primary" id="addBtn">＋ 作品を登録</button>
  <button id="refreshTrackedBtn">追跡中を更新</button>
  <details class="more-menu toolbar-more">
    <summary class="btn">︙ その他</summary>
    <div class="menu-panel">
      <button id="refreshAllBtn">全作品を更新</button>
      <button id="exportBtn">バックアップ</button>
      <button id="importBtn">復元</button>
    </div>
  </details>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>

<div class="filters">
  <select id="statusFilter">
    <option value="">すべての状態</option>
    <option value="unread">未読</option>
    <option value="tracking">追跡中</option>
    <option value="finished">読了</option>
    <option value="paused">保留</option>
  </select>
  <select id="sortBy">
    <option value="updated">更新順</option>
    <option value="unread">未読数順</option>
    <option value="title">タイトル順</option>
  </select>
</div>

<main id="list"></main>

<dialog id="editDialog">
  <form method="dialog" id="editForm">
    <h2 id="dialogTitle">作品を登録</h2>
    <input type="hidden" id="bookId">

    <label>作品URL または 話URL</label>
    <div class="fetchbox">
      <input id="url" type="url" required placeholder="https://ncode.syosetu.com/n1234ab/125/ または https://novel18.syosetu.com/n1234ab/125/">
      <button type="button" id="fetchBtn">情報取得</button>
    </div>
    <div class="statusmsg" id="fetchMsg"></div>

    <label>作品タイトル</label>
    <input id="title" required placeholder="URLから自動入力">

    <div class="row">
      <div>
        <label>Nコード</label>
        <input id="ncode" class="readonly" readonly>
      </div>
      <div>
        <label>作者</label>
        <input id="writer" class="readonly" readonly>
      </div>
    </div>

    <div class="row">
      <div>
        <label>読了話数</label>
        <input id="readEpisode" type="number" min="0" value="0">
      </div>
      <div>
        <label>最新話数</label>
        <input id="latestEpisode" type="number" min="0" value="0">
      </div>
    </div>

    <label>状態</label>
    <select id="status">
      <option value="unread">未読</option>
      <option value="tracking">追跡中</option>
      <option value="finished">読了</option>
      <option value="paused">保留</option>
    </select>

    <input type="hidden" id="generalLastup">
    <input type="hidden" id="workEnd" value="1">

    <label>評価</label>
    <select id="rating">
      <option value="0">未評価</option>
      <option value="1">★</option>
      <option value="2">★★</option>
      <option value="3">★★★</option>
      <option value="4">★★★★</option>
      <option value="5">★★★★★</option>
    </select>

    <label>メモ</label>
    <textarea id="memo" rows="3" placeholder="感想、登場人物、再開時メモなど"></textarea>

    <div class="actions">
      <button type="button" id="cancelBtn">キャンセル</button>
      <button type="submit" class="primary">保存</button>
      <button type="button" class="danger wide" id="deleteBtn" hidden>削除</button>
    </div>
    <p class="small">作品情報は公式の「なろう小説API／なろうR18小説API」から取得します。検索除外作品などは取得できない場合があります。</p>
  </form>
</dialog>

<script>
const KEY_V3="narou_shelf_mvp_v3";
const KEY_V2="narou_shelf_mvp_v2";
const KEY_V1="narou_shelf_mvp_v1";
const $=id=>document.getElementById(id);

function load(){
  try{
    const v3=JSON.parse(localStorage.getItem(KEY_V3)||"null");
    if(Array.isArray(v3)) return v3;
    const v2=JSON.parse(localStorage.getItem(KEY_V2)||"null");
    if(Array.isArray(v2)){
      localStorage.setItem(KEY_V3, JSON.stringify(v2));
      return v2;
    }
    const v1=JSON.parse(localStorage.getItem(KEY_V1)||"null");
    if(Array.isArray(v1)){
      localStorage.setItem(KEY_V2, JSON.stringify(v1));
      return v1;
    }
  }catch(e){}
  return [];
}
let books=load();
let summaryFilter="";

function normalizeStatus(status){
  if(status==="reading" || status==="waiting") return "tracking";
  if(["unread","tracking","paused","finished"].includes(status)) return status;
  return "unread";
}
books=books.map(book=>({...book,status:normalizeStatus(book.status)}));

function save(){localStorage.setItem(KEY_V3,JSON.stringify(books));render()}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function statusLabel(s){return({unread:"未読",tracking:"追跡中",finished:"読了",paused:"保留"})[normalizeStatus(s)]||s}

function formatPublishedAt(value){
  if(!value) return "";
  const match=String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return match ? `${Number(match[2])}/${Number(match[3])}更新` : String(value);
}

function parseNarouUrl(url){
  try{
    const u=new URL(url);
    if(u.hostname!=="ncode.syosetu.com" && u.hostname!=="novel18.syosetu.com") return null;
    const parts=u.pathname.split("/").filter(Boolean);
    const code=(parts[0]||"").toUpperCase();
    if(!/^N[0-9A-Z]+$/i.test(code)) return null;
    const episode=(parts[1] && /^\d+$/.test(parts[1])) ? Number(parts[1]) : null;
    const isR18=u.hostname==="novel18.syosetu.com";
    return {ncode:code,episode,isR18,base:`https://${isR18?"novel18":"ncode"}.syosetu.com/${code.toLowerCase()}/`};
  }catch(e){return null}
}

function apiJsonp(ncode,isR18=false){
  return new Promise((resolve,reject)=>{
    const cb="narouCb_"+Date.now()+"_"+Math.floor(Math.random()*100000);
    const script=document.createElement("script");
    const timer=setTimeout(()=>cleanup(new Error("timeout")),10000);
    function cleanup(err,data){
      clearTimeout(timer);
      delete window[cb];
      script.remove();
      err?reject(err):resolve(data);
    }
    window[cb]=data=>cleanup(null,data);
    script.onerror=()=>cleanup(new Error("load error"));
    const params=new URLSearchParams({
      out:"jsonp", callback:cb, ncode:ncode.toLowerCase(),
      of:"t-n-w-gl-e-ga-i", lim:"1"
    });
    script.src=`https://api.syosetu.com/${isR18?"novel18api":"novelapi"}/api/?`+params.toString();
    document.head.appendChild(script);
  });
}

async function fetchBookInfoFromUrl(url){
  const parsed=parseNarouUrl(url);
  if(!parsed) throw new Error("「小説家になろう」またはR18作品の作品URL・話URLを入力してください。");
  const data=await apiJsonp(parsed.ncode,parsed.isR18);
  if(!Array.isArray(data) || data.length<2) throw new Error("作品情報を取得できませんでした。");
  const info=data[1];
  return {
    ...parsed,
    isR18:parsed.isR18,
    title:String(info.title??""),
    writer:String(info.writer??""),
    latestEpisode:Number(info.general_all_no??0),
    generalLastup:String(info.general_lastup??""),
    end:Number(info.end??1),
    isstop:Number(info.isstop??0)
  };
}

async function fillFromUrl(){
  const msg=$("fetchMsg");
  msg.className="statusmsg";
  msg.textContent="取得中…";
  $("fetchBtn").disabled=true;
  try{
    const info=await fetchBookInfoFromUrl($("url").value.trim());
    $("title").value=info.title;
    $("ncode").value=info.ncode;
    $("writer").value=info.writer;
    $("latestEpisode").value=info.latestEpisode;
    $("generalLastup").value=info.generalLastup;
    $("workEnd").value=info.end;
    if(info.episode!==null) $("readEpisode").value=info.episode;
    if(info.end===0 && info.latestEpisode>0 && Number($("readEpisode").value)>=info.latestEpisode){
      $("status").value="finished";
    }
    msg.className="statusmsg ok";
    msg.textContent=`取得しました：${info.latestEpisode}話 / ${info.writer || "作者名なし"}${info.isR18 ? " / R18" : ""}${info.generalLastup ? " / 最終掲載 "+info.generalLastup : ""}`;
  }catch(e){
    msg.className="statusmsg err";
    msg.textContent=e.message || "取得に失敗しました。";
  }finally{
    $("fetchBtn").disabled=false;
  }
}

function continueUrl(book){
  const parsed=parseNarouUrl(book.url);
  const base=parsed ? parsed.base : book.url.replace(/\/+$/,"")+"/";
  const next=Math.max(1,Number(book.readEpisode||0)+1);
  return base+next+"/";
}

function render(){
  const filter=$("statusFilter").value, sortBy=$("sortBy").value;
  const counts={
    unread:books.filter(b=>Number(b.latestEpisode||0)>Number(b.readEpisode||0)&&b.status!=="finished").length,
    unreadState:books.filter(b=>b.status==="unread").length,
    tracking:books.filter(b=>b.status==="tracking").length
  };
  $("summary").innerHTML=`
    <button type="button" class="chip ${summaryFilter==="unread"?"active":""}" data-summary="unread">🔴 更新あり <b>${counts.unread}</b></button>
    <button type="button" class="chip ${summaryFilter==="status-unread"?"active":""}" data-summary="status-unread">🆕 未読 <b>${counts.unreadState}</b></button>
    <button type="button" class="chip ${summaryFilter==="tracking"?"active":""}" data-summary="tracking">📌 追跡中 <b>${counts.tracking}</b></button>
    `;
  document.querySelectorAll("[data-summary]").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const value=btn.dataset.summary;
      summaryFilter=summaryFilter===value?"":value;
      $("statusFilter").value="";
      render();
    });
  });

  let list=books.filter(b=>!filter||b.status===filter);
  if(summaryFilter==="unread"){
    list=list.filter(b=>Number(b.latestEpisode||0)>Number(b.readEpisode||0)&&b.status!=="finished");
  }else if(summaryFilter==="status-unread"){
    list=list.filter(b=>b.status==="unread");
  }else if(summaryFilter){
    list=list.filter(b=>b.status===summaryFilter);
  }
  list=[...list].sort((a,b)=>{
    if(sortBy==="title") return a.title.localeCompare(b.title,"ja");
    if(sortBy==="unread") return ((b.latestEpisode||0)-(b.readEpisode||0))-((a.latestEpisode||0)-(a.readEpisode||0));
    return (b.updatedAt||0)-(a.updatedAt||0);
  });

  $("list").innerHTML=list.length?list.map(b=>{
    const unread=Math.max(0,Number(b.latestEpisode||0)-Number(b.readEpisode||0));
    const rating=b.rating?` ・ ${"★".repeat(b.rating)}`:"";
    return `<section class="card">
      <div class="title">${esc(b.title)}</div>
      <div class="meta">
        ${b.writer?esc(b.writer):"作者名なし"}${b.generalLastup?` ・ ${esc(formatPublishedAt(b.generalLastup))}`:""}<br>
        ${statusLabel(b.status)}${rating}<br>
        読了：第${Number(b.readEpisode||0)}話 / 最新：第${Number(b.latestEpisode||0)}話
        ${unread?`<span class="unread"> ・ 未読 ${unread}話</span>`:""}
      </div>
      ${b.memo?`<div class="meta" style="margin-top:6px">${esc(b.memo)}</div>`:""}
      <div class="card-actions">
        <a class="btn primary" href="${esc(continueUrl(b))}" target="_blank" rel="noopener">続きから読む</a>
        <button onclick="markLatestRead('${b.id}')">最新話まで読了</button>
        <details class="more-menu card-more">
          <summary class="btn" aria-label="その他の操作">︙</summary>
          <div class="menu-panel">
            <button onclick="openEdit('${b.id}')">編集</button>
            <a class="btn" href="${esc((parseNarouUrl(b.url)||{}).base||b.url)}" target="_blank" rel="noopener">作品トップを開く</a>
          </div>
        </details>
      </div>
    </section>`;
  }).join(""):`<div class="empty">まだ作品がありません。<br>URLを貼って本棚に移しましょう。</div>`;
}

function resetForm(){
  $("editForm").reset();
  $("bookId").value="";
  $("readEpisode").value=0;
  $("latestEpisode").value=0;
  $("status").value="unread";
  $("rating").value="0";
  $("ncode").value="";
  $("writer").value="";
  $("generalLastup").value="";
  $("workEnd").value="1";
  $("fetchMsg").textContent="";
  $("fetchMsg").className="statusmsg";
}

function openNew(){
  $("dialogTitle").textContent="作品を登録";
  resetForm();
  $("deleteBtn").hidden=true;
  $("editDialog").showModal();
}

window.markLatestRead=function(id){
  const b=books.find(x=>x.id===id);
  if(!b)return;
  const latest=Number(b.latestEpisode||0);
  if(latest<=0){
    alert("最新話数が取得できていません。先に「最新話を更新」を実行してください。");
    return;
  }
  if(Number(b.readEpisode||0)>=latest){
    alert("すでに最新話まで読了になっています。");
    return;
  }
  if(confirm(`第${latest}話まで読了として記録しますか？`)){
    b.readEpisode=latest;
    if(Number(b.workEnd)===0) b.status="finished";
    b.updatedAt=Date.now();
    save();
  }
};

window.openEdit=function(id){
  const b=books.find(x=>x.id===id);if(!b)return;
  $("dialogTitle").textContent="作品を編集";
  $("bookId").value=b.id;
  $("title").value=b.title||"";
  $("url").value=b.url||"";
  $("ncode").value=b.ncode||parseNarouUrl(b.url)?.ncode||"";
  $("writer").value=b.writer||"";
  $("readEpisode").value=b.readEpisode||0;
  $("latestEpisode").value=b.latestEpisode||0;
  $("status").value=normalizeStatus(b.status);
  $("rating").value=b.rating||0;
  $("memo").value=b.memo||"";
  $("generalLastup").value=b.generalLastup||"";
  $("workEnd").value=Number.isFinite(Number(b.workEnd))?Number(b.workEnd):1;
  $("fetchMsg").textContent="";
  $("fetchMsg").className="statusmsg";
  $("deleteBtn").hidden=false;
  $("editDialog").showModal();
};

$("editForm").addEventListener("submit",e=>{
  e.preventDefault();
  const id=$("bookId").value;
  const parsed=parseNarouUrl($("url").value.trim());
  const obj={
    id:id||(crypto.randomUUID?crypto.randomUUID():String(Date.now())),
    title:$("title").value.trim(),
    url:$("url").value.trim(),
    ncode:$("ncode").value.trim()||(parsed?.ncode||""),
    writer:$("writer").value.trim(),
    readEpisode:Number($("readEpisode").value||0),
    latestEpisode:Number($("latestEpisode").value||0),
    status:$("status").value,
    rating:Number($("rating").value||0),
    memo:$("memo").value.trim(),
    generalLastup:$("generalLastup").value,
    workEnd:Number($("workEnd").value||1),
    lastCheckedAt:id?(books.find(x=>x.id===id)?.lastCheckedAt||null):null,
    updatedAt:Date.now()
  };
  if(!obj.title||!obj.url)return;
  const i=books.findIndex(x=>x.id===obj.id);
  if(i>=0)books[i]=obj;else books.unshift(obj);
  save();$("editDialog").close();
});

$("fetchBtn").addEventListener("click",fillFromUrl);
$("url").addEventListener("change",()=>{
  const p=parseNarouUrl($("url").value.trim());
  if(p){
    $("ncode").value=p.ncode;
    if(p.episode!==null && Number($("readEpisode").value||0)===0) $("readEpisode").value=p.episode;
  }
});

async function refreshBooks(targets,button,defaultLabel){
  $("refreshTrackedBtn").disabled=true;
  $("refreshAllBtn").disabled=true;
  button.textContent="更新中…";
  let ok=0,ng=0;
  for(const b of targets){
    try{
      const p=parseNarouUrl(b.url);
      if(!p){ng++;continue}
      const info=await fetchBookInfoFromUrl(b.url);
      b.ncode=info.ncode;b.title=info.title||b.title;b.writer=info.writer||b.writer;
      b.latestEpisode=info.latestEpisode;b.generalLastup=info.generalLastup;
      b.workEnd=info.end;b.lastCheckedAt=new Date().toISOString();b.updatedAt=Date.now();
      if(info.end===0 && Number(b.readEpisode)>=Number(info.latestEpisode)) b.status="finished";
      ok++;
    }catch(e){ng++}
  }
  save();
  $("refreshTrackedBtn").disabled=false;
  $("refreshAllBtn").disabled=false;
  button.textContent=defaultLabel;
  alert(`更新完了：成功 ${ok}件 / 失敗 ${ng}件`);
}

$("refreshTrackedBtn").addEventListener("click",()=>{
  const targets=books.filter(b=>b.status==="tracking");
  if(!targets.length){alert("追跡中の作品はありません。");return;}
  refreshBooks(targets,$("refreshTrackedBtn"),"追跡中を更新");
});

$("refreshAllBtn").addEventListener("click",()=>{
  if(!books.length){alert("作品がありません。");return;}
  refreshBooks(books,$("refreshAllBtn"),"全作品を更新");
});

$("deleteBtn").addEventListener("click",()=>{
  const id=$("bookId").value;if(!id)return;
  if(confirm("この作品を本棚から削除しますか？")){
    books=books.filter(x=>x.id!==id);save();$("editDialog").close();
  }
});
$("addBtn").addEventListener("click",openNew);
$("cancelBtn").addEventListener("click",()=>$("editDialog").close());
$("statusFilter").addEventListener("change",()=>{summaryFilter="";render();});
$("sortBy").addEventListener("change",render);

$("exportBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify({version:4,exportedAt:new Date().toISOString(),books},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="narou_shelf_backup.json";
  a.click();URL.revokeObjectURL(a.href);
});
$("importBtn").addEventListener("click",()=>$("importFile").click());
$("importFile").addEventListener("change",async e=>{
  const file=e.target.files?.[0];if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    const incoming=Array.isArray(data)?data:data.books;
    if(!Array.isArray(incoming))throw new Error();
    if(confirm(`バックアップから ${incoming.length} 件を復元します。現在の本棚は置き換わります。`)){
      books=incoming.map(book=>({...book,status:normalizeStatus(book.status)}));save();
    }
  }catch(e){alert("バックアップファイルを読み込めませんでした。")}
  e.target.value="";
});

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

</script>
</body>
</html>
